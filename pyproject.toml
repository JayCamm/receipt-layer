[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-layer"
version = "0.2.0"
description = "Completion-evidence harness: signed tool-call receipts plus a completion gate that checks evidence, not prose"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "JayCamm"}]

[project.urls]
Homepage = "https://github.com/JayCamm/receipt-layer"

[tool.setuptools.packages.find]
include = ["receipt_layer*"]
